# BACKGROUND
background {
    monitor =
    path = /usr/share/sddm/themes/sddm-astronaut-theme/Backgrounds/bg.png

    blur_passes = 4
    blur_size = 1
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

animations {
    enabled = true
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgba(255, 255, 255, .85)
    font_size = 22
    font_family = 0xProto Nerd Font
    position = 0, 420
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME12
    color = rgba(255, 255, 255, .85)
    font_size = 90
    font_family = 0xProto Nerd Font
    position = 0, 350
    halign = center
    valign = center
}

# USER-NAME
shape {
    monitor =
    size = 350, 40
    rounding = 20
    border_size = 2
    border_color = rgb(255, 255, 255)
    color = rgba(40, 10, 30, 1)

    position = 0, 0
    halign = center
    valign = center
}
label {
    monitor =
    text = $USER
    color = rgb(255, 255, 255)
    font_size = 20
    font_family = 0xProto Nerd Font
    position = 0, 0
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 350, 40
    rounding = 20
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgb(255, 255, 255)
    capslock_color = rgb(0, 0, 0)
    inner_color = rgb(40, 10, 30)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    font_family = 0xProto Nerd Font
    placeholder_text = Enter password
    hide_input = false
    position = 0, -70
    halign = center
    valign = center
}

# USER-NAME
shape {
    monitor =
    size = 70, 40
    rounding = 20
    border_size = 2
    border_color = rgb(255, 255, 255)
    color = rgba(40, 10, 30, 1)

    position = 230, -70
    halign = center
    valign = center
}
label {
    monitor =
    text = 󰌌 $LAYOUT[en,ru]
    color = rgb(255, 255, 255)
    font_size = 16
    font_family = 0xProto Nerd Font
    position = 230, -70
    halign = center
    valign = center
}
